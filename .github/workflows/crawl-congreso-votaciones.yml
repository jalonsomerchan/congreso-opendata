name: Crawl Congreso Open Data

on:
  workflow_dispatch:
    inputs:
      max_new_votes:
        description: "Máximo de votaciones nuevas a descargar (0 = sin límite)"
        required: false
        default: "0"
      max_new_initiatives:
        description: "Máximo de datasets de iniciativas nuevos a descargar (0 = sin límite)"
        required: false
        default: "0"
      max_new_interventions:
        description: "Máximo de recursos de intervenciones nuevos a descargar (0 = sin límite)"
        required: false
        default: "0"
      max_new_deputies:
        description: "Máximo de datasets de diputados nuevos a descargar (0 = sin límite)"
        required: false
        default: "0"
      group_latest_limit:
        description: "Número de registros incluidos en cada latest.json por grupo"
        required: false
        default: "20"
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/crawl-congreso-votaciones.yml"
      - "scripts/crawl_congreso_votaciones.py"
      - "scripts/crawl_congreso_iniciativas.py"
      - "scripts/crawl_congreso_intervenciones.py"
      - "scripts/crawl_congreso_diputados.py"
      - "scripts/build_congreso_indexes.py"

permissions:
  contents: write

concurrency:
  group: crawl-congreso-opendata
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest

    env:
      MAX_NEW_VOTES: ${{ github.event.inputs.max_new_votes || '0' }}
      MAX_NEW_INITIATIVES: ${{ github.event.inputs.max_new_initiatives || '0' }}
      MAX_NEW_INTERVENTIONS: ${{ github.event.inputs.max_new_interventions || '0' }}
      MAX_NEW_DEPUTIES: ${{ github.event.inputs.max_new_deputies || '0' }}
      GROUP_LATEST_LIMIT: ${{ github.event.inputs.group_latest_limit || '20' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Crawl votaciones
        run: python scripts/crawl_congreso_votaciones.py

      - name: Crawl iniciativas
        run: python scripts/crawl_congreso_iniciativas.py

      - name: Crawl intervenciones
        run: python scripts/crawl_congreso_intervenciones.py

      - name: Crawl diputados
        run: python scripts/crawl_congreso_diputados.py

      - name: Build grouped indexes
        run: python scripts/build_congreso_indexes.py

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain -- data/congreso)" ]; then
            echo "No hay nuevos datos del Congreso"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/congreso
          git commit -m "Actualizar datos Open Data del Congreso"
          git pull --rebase --autostash
          git push
